<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JeuTirPerso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 1024px;
            height: 768px;
            border: 3px solid #00ff00;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            z-index: 10;
        }

        #score {
            margin-bottom: 10px;
        }

        #lives {
            color: #ff0000;
        }

        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #00ff00;
            font-size: 12px;
            opacity: 0.7;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 3px solid #ff0000;
            color: #ff0000;
            text-align: center;
            border-radius: 10px;
            z-index: 100;
            display: none;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0000;
        }

        #gameOver p {
            font-size: 24px;
            margin-bottom: 20px;
        }

        #gameOver button {
            padding: 10px 30px;
            font-size: 16px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #gameOver button:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">Score: 0</div>
            <div id="lives">Vies: 3</div>
            <div id="wave">Vague: 1</div>
            <div id="ammo">Munitions: 30/30</div>
        </div>
        <div id="instructions">
            W/S: Avancer/Reculer | Clic Gauche: Tirer | Clic Droit: Viser | R: Recharger
        </div>
        <div id="gameOver">
            <h1>GAME OVER</h1>
            <p id="finalScore">Score: 0</p>
            <button onclick="location.reload()">Rejouer</button>
        </div>
    </div>

    <script src="game.js?v=2"></script>
</body>
</html>
